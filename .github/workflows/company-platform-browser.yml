name: Phoenix Company Platform Browser Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/core-http-api-v1

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/company-platform/package-lock.json

      - name: Install Company Platform dependencies
        working-directory: frontend/company-platform
        run: npm install

      - name: Install Chromium
        working-directory: frontend/company-platform
        run: npx playwright install --with-deps chromium

      - name: Run VPS browser gate
        working-directory: frontend/company-platform
        env:
          PHOENIX_E2E_BASE_URL: ${{ vars.PHOENIX_E2E_BASE_URL }}
          PHOENIX_E2E_USERNAME: ${{ secrets.PHOENIX_E2E_USERNAME }}
          PHOENIX_E2E_PASSWORD: ${{ secrets.PHOENIX_E2E_PASSWORD }}
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-platform-playwright-report
          path: frontend/company-platform/playwright-report/
          if-no-files-found: ignore
